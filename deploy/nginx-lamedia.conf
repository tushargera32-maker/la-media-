# Nginx site for la-media on the Hostinger VPS.
# Install: sudo cp deploy/nginx-lamedia.conf /etc/nginx/sites-available/la-media
#          sudo sed -i 's/YOUR_DOMAIN/lamediacommunications.com/g' /etc/nginx/sites-available/la-media
#          sudo ln -s /etc/nginx/sites-available/la-media /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

# App reverse proxy (PM2 serves 127.0.0.1:3000)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot fills these in; created by `certbot --nginx`
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Allow big poster/gallery uploads
    client_max_body_size 25M;

    # Next.js static assets: cache hard, they are content-hashed
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
